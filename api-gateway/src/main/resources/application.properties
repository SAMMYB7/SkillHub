spring.application.name=api-gateway
server.port=2005

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# --- WebFlux Gateway ---
spring.cloud.gateway.server.webflux.discovery.locator.enabled=true
spring.cloud.gateway.server.webflux.discovery.locator.lower-case-service-id=true

# Route to user-service
spring.cloud.gateway.server.webflux.routes[0].id=user-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://user-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/user-service/**
spring.cloud.gateway.server.webflux.routes[0].filters[0]=RewritePath=/user-service/(?<segment>.*), /${segment}

# Remove cookies globally
spring.cloud.gateway.server.webflux.default-filters[0]=RemoveRequestHeader=Cookie

# Enable Actuator to see gateway routes
management.endpoints.web.exposure.include=*
management.endpoint.gateway.enabled=true
management.endpoint.health.show-details=always

# LOGGING
logging.level.org.springframework.cloud.gateway=TRACE
logging.level.org.springframework.web=DEBUG
logging.level.reactor.netty=DEBUG

spring.security.enabled=false
spring.main.allow-bean-definition-overriding=true

